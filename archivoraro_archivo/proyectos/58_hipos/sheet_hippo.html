<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0}svg{display:block}</style></head><body>
<svg id="sv" width="1080" height="1920" viewBox="0 0 1080 1920"></svg>
<script src="stick.js"></script><script src="hair.js"></script><script src="hippo.js"></script>
<script>
const K = '#1b1720';
const lab = (x, y, t, c = '#ffd34a', sz = 34) => `<text x="${x}" y="${y}" font-family="Inter" font-weight="900" font-size="${sz}" letter-spacing="1" fill="${c}" stroke="${K}" stroke-width="8" paint-order="stroke">${t}</text>`;
const bg = (y0, h, sky = ['#9fd3f0', '#e8f3ea']) => `<defs><linearGradient id="sk${y0}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${sky[0]}"/><stop offset="1" stop-color="${sky[1]}"/></linearGradient></defs><rect x="0" y="${y0}" width="1080" height="${h}" fill="url(#sk${y0})"/>`;
const jungle = (y, h) => { let s = ''; for (let i = 0; i < 14; i++) { const x = i * 84 - 20, r = 60 + (i * 37) % 40; s += `<circle cx="${x}" cy="${y + 10 - (i % 3) * 18}" r="${r}" fill="${i % 2 ? '#4f9a52' : '#3f8445'}" stroke="${K}" stroke-width="5"/>`; } return s + `<rect x="0" y="${y + 10}" width="1080" height="${h}" fill="#3f8445"/>`; };
const water = (y, h, op = 1) => `<rect x="0" y="${y}" width="1080" height="${h}" fill="#5a8f9e" opacity="${op}"/><rect x="0" y="${y}" width="1080" height="10" fill="#9fc8cf" opacity="${op}"/>` + [0, 1, 2, 3, 4, 5].map(i => `<path d="M${60 + i * 170},${y + 40 + (i % 2) * 30} q30,-12 60,0" stroke="#cfe7ea" stroke-width="5" fill="none" stroke-linecap="round" opacity="${.7 * op}"/>`).join('');
const bank = (y, h) => `<path d="M0,${y} Q540,${y - 24} 1080,${y} L1080,${y + h} L0,${y + h}Z" fill="#c9a66b" stroke="${K}" stroke-width="6"/><path d="M0,${y + 20} Q540,${y} 1080,${y + 20}" stroke="#b08f58" stroke-width="10" fill="none"/>`;
let s = `<rect width="1080" height="1920" fill="#11131f"/>`;
// header
s += lab(40, 70, 'HIPOPÓTAMO · BOCETO', '#ffd34a', 46) + lab(40, 112, 'Río Magdalena, Colombia', '#ffffff', 26);
// A · walking on the bank (big)
s += `<g transform="translate(0,140)">${bg(0, 620)}${jungle(250, 120)}${water(330, 120)}${bank(450, 170)}<g transform="translate(470,560) scale(.95)">${hippo({ walk: .9, eye: 'calm', look: [3, 0] })}</g>${lab(30, 600, 'ANDANDO · DE LADO')}</g>`;
// B · yawn with tusks
s += `<g transform="translate(0,780)">${bg(0, 560, ['#f6c98c', '#fbe6c4'])}${jungle(200, 80)}${water(250, 320)}<g transform="translate(-40,520) scale(1.18)">${hippo({ open: 1, eye: 'angry', wet: true })}</g>${water(470, 90, .92)}${lab(30, 540, 'BOSTEZO · COLMILLOS')}</g>`;
// C · in the river + baby + scale with the fisherman
s += `<g transform="translate(0,1360)">${bg(0, 560, ['#8fcbe8', '#dff0ea'])}${jungle(130, 90)}${water(190, 380)}`;
s += `<g transform="translate(330,545) scale(.82)">${hippo({ eye: 'calm', wet: true, look: [4, 1] })}</g><g transform="translate(210,272) scale(.3)">${hippo({ eye: 'wide', wet: false, look: [3, -2] })}</g>${water(300, 270, 1)}`;
const canoe = `<path d="M-170,-10 Q0,40 170,-10 L150,30 Q0,62 -150,30Z" fill="#8a5a32" stroke="${K}" stroke-width="7" stroke-linejoin="round"/><path d="M-160,-6 Q0,38 160,-6" stroke="#b07a44" stroke-width="6" fill="none"/>`;
s += `<g transform="translate(900,470)"><g transform="scale(.6)">${stick({ outfit: 'shirt', top: '#f3efe2', topD: '#cfc7b3', pants: '#3b4a63', scarf: '#d63c2f', hat: 'vueltiao', mustache: '#2a1a12', face: 'wide', mouth: 'o', brows: .6, sweat: true, prop: 'paddle', armL: [30, 50], armR: [60, 70], turn: -.5, look: [-8, 0], shoes: '#5a3a22', sole: '#2a2a2a' })}</g>${canoe}</g>${water(498, 72, .85)}`;
s += `<path d="M0,445 Q540,425 1080,445 L1080,560 L0,560Z" fill="#c9a66b" opacity="0"/>` + lab(30, 540, 'EN EL RÍO · CRÍA ENCIMA · PESCADOR') + `</g>`;
document.getElementById('sv').innerHTML = s; document.title = 'ready';
</script></body></html>
