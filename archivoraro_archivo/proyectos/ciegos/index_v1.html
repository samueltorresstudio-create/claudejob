<!doctype html>
<html><head><meta charset="utf-8">
<style>
html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:#12131f}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden;background:#12131f}
svg{position:absolute;left:0;top:0}
#cap{position:absolute;left:46px;right:46px;top:1185px;text-align:center;font-family:'Inter';font-weight:900;
  line-height:1.0;letter-spacing:-2px;color:#fff;text-transform:uppercase}
.w{display:inline-block;margin:0 .02em;transform-origin:50% 75%;text-shadow:0 6px 0 rgba(0,0,0,.28)}
</style></head>
<body><div id="stage">
<svg id="scene" width="1080" height="1920" viewBox="0 0 1080 1920"></svg>
<div id="cap"></div>
<svg id="hud" width="1080" height="1920" viewBox="0 0 1080 1920"></svg>
</div>
<script src="lib.js"></script>
<script src="voice.js"></script>
<script>
const LUCIA={skin:'#f2c6a4',top:'#2f9c95',topD:'#22756f',pants:'#2e3350',hs:'long',hair:'#2b1d1a',hood:true,strings:true,pocket:true};
const GIRL={skin:'#f6cfae',top:'#f2c230',topD:'#c99b1c',pants:'#3b4a7a',hs:'pigtails',hair:'#7a4528',hood:true,strings:false,pocket:false};
const PAL=[{skin:'#f1c7a5',top:'#7a6aa8',hs:'short',hair:'#3a2a26'},{skin:'#8d5a3f',top:'#c77b3b',hs:'bald',hair:'#1d1514'},
  {skin:'#d9a57f',top:'#5b8a6e',hs:'long',hair:'#6b4428'},{skin:'#f6cfae',top:'#b24e5a',hs:'short',hair:'#c79a5a'},{skin:'#b9825e',top:'#4f6fa0',hs:'messy',hair:'#1f1714'}];
function blindP(i,x,y,s,t,o={}){
  const p=PAL[i%PAL.length];
  return person(Object.assign({x,y,s,skin:p.skin,top:p.top,topD:mix(p.top,'#000000',.28),hs:p.hs,hair:p.hair,eyes:'blind',
    mouth:'line',aL:95+4*Math.sin(t*2+i),aR:100,tilt:-8*Math.sin(t*.8+i),look:[0,0],walk:o.walk===false?null:t*3.2+i},o));
}
function bubble(x,y,text,a){
  if(a<=0) return '';
  const w=text.length*19+44;
  return `<g opacity="${a.toFixed(2)}" transform="translate(${x},${y}) scale(${eBack(a).toFixed(3)})"><rect x="${-w/2}" y="-30" width="${w}" height="58" rx="18" fill="#fff"/><polygon points="-12,26 12,26 -4,48" fill="#fff"/><text x="0" y="12" text-anchor="middle" font-family="Inter" font-weight="900" font-size="30" fill="#2a2233">${text}</text></g>`;
}
function wordTimes(b){
  const ws=b.cap.split(' ').map(w=>w.split('|')[0]);
  const wt=ws.map(w=>w.replace(/[^A-Za-zÁÉÍÓÚÜÑáéíóúüñ0-9]/g,'').length+1.5);
  const tot=wt.reduce((a,c)=>a+c,0);let acc=0;
  return ws.map((w,i)=>{const s=b.lead+b.vdur*.97*acc/tot;acc+=wt[i];return s});
}
const P=(t,a,d=.3)=>eOut(prog(t,a,a+d));

// ---------- scene key times, relative to the scene start (B = this scene's beats) ----------
const EVS={
  bedroom:B=>({ring:.05,stretch:.55}),
  city:B=>({bub:[.25,.8,1.35]}),
  eyes:B=>({lock:.12}),
  id:B=>({beeps:[.15,B[0].w[1],B[0].lead+B[0].vdur]}),
  tv:B=>({sw:B[1].s}),
  crowd:B=>({red:B[1].s,lock:B[1].s+1.0}),
  mirror:B=>({gl:B[0].s+B[0].lead+.3,tags:[B[1].w[0],B[1].w[2],B[1].w[4]]}),
  street:B=>({trap:B[1].w[5],see:B[2].w[1],fall:B[2].w[7],ok:B[2].w[7]+.75}),
  market:B=>({can:B[2].w[1],quiet:B[2].w[4]}),
  aisle:B=>({girl:B[0].w[7],hands:B[1].w[4]}),
  girl:B=>({look:B[0].w[1],open:B[1].w[4]}),
};

const S={};
S.bedroom=(t,D,B)=>{
  const E=EVS.bedroom(B);
  let s=`<rect width="1080" height="1100" fill="#f4dcc2"/>`;
  for(let i=0;i<14;i++) s+=`<rect x="${i*80}" y="0" width="40" height="1100" fill="#fff" opacity=".09"/>`;
  s+=`<defs><clipPath id="win"><rect x="618" y="228" width="324" height="324"/></clipPath></defs>`;
  s+=`<rect x="600" y="210" width="360" height="360" rx="10" fill="#fff"/><g clip-path="url(#win)"><rect x="618" y="228" width="324" height="324" fill="url(#skyDay)"/>${sun(860,300,40)}
    <rect x="610" y="430" width="90" height="140" fill="#b9cbe0"/><rect x="700" y="470" width="120" height="100" fill="#a9bdd4"/><rect x="820" y="410" width="80" height="160" fill="#c3d3e5"/><rect x="900" y="450" width="60" height="120" fill="#b0c4da"/></g>`;
  s+=`<rect x="773" y="228" width="14" height="324" fill="#fff"/><rect x="618" y="383" width="324" height="14" fill="#fff"/>`;
  s+=`<path d="M570,190 L640,190 Q610,400 650,600 L570,600Z" fill="#e98a8a"/><path d="M990,190 L920,190 Q950,400 910,600 L990,600Z" fill="#e98a8a"/><rect x="560" y="182" width="440" height="14" rx="7" fill="#b86a5a"/>`;
  s+=`<polygon points="618,552 942,552 1080,1100 380,1100" fill="#fff6d8" opacity=".18"/>`;
  s+=`<rect y="900" width="1080" height="200" fill="#d4ab84"/>`;
  // nightstand + alarm clock
  s+=`<rect x="60" y="760" width="160" height="150" rx="8" fill="#a8754f"/><rect x="74" y="800" width="132" height="10" fill="#8a5a3a"/>`;
  const ring=t<1.35, sh=ring?Math.sin(t*70)*7:0;
  s+=`<g transform="translate(140,712) rotate(${sh.toFixed(1)})"><circle cx="-30" cy="-44" r="16" fill="#c9302c"/><circle cx="30" cy="-44" r="16" fill="#c9302c"/><circle cx="0" cy="0" r="46" fill="#e2453b"/><circle cx="0" cy="0" r="36" fill="#fff"/>
    <line x1="0" y1="0" x2="0" y2="-26" stroke="${INK}" stroke-width="5" stroke-linecap="round"/><line x1="0" y1="0" x2="0" y2="22" stroke="${INK}" stroke-width="4" stroke-linecap="round"/><rect x="-20" y="40" width="10" height="14" fill="#c9302c"/><rect x="10" y="40" width="10" height="14" fill="#c9302c"/></g>`;
  if(ring) s+=soundArcs(200,700,t,'#e2453b',1)+soundArcs(80,700,t,'#e2453b',-1);
  // bed
  s+=`<rect x="240" y="600" width="50" height="320" rx="10" fill="#8a5a3a"/><rect x="270" y="780" width="720" height="70" rx="14" fill="#f4f1f7"/><ellipse cx="370" cy="768" rx="86" ry="32" fill="#fff"/>`;
  const st=prog(t,E.stretch,E.stretch+.3)*(1-prog(t,1.25,1.5));
  const eyes=t<E.stretch?'closed':'open';
  s+=person({...LUCIA,x:420,y:905,s:.86,eyes,aL:lerp(14,158,st),aR:lerp(14,158,st),mouth:st>.5?'o':'line',look:t>1.4?[10,-4]:[0,0],tilt:t<E.stretch?6:0});
  s+=`<path d="M330,820 Q380,796 460,808 L990,802 Q1006,806 1006,834 L1006,890 L330,890Z" fill="#6fa8dc"/><path d="M520,830 Q660,848 800,826 M680,862 Q830,878 960,856" stroke="#8cbbe6" stroke-width="6" fill="none" stroke-linecap="round"/>`;
  s+=`<rect x="240" y="870" width="780" height="64" rx="8" fill="#8a5a3a"/>`;
  return cam(s,1.06-.05*eOut(t/D),540,600,540,600);
};
const CITYB=[{x:-20,w:230,h:520,c:'#e8d5b5'},{x:200,w:200,h:640,c:'#d98e6a'},{x:390,w:240,h:470,c:'#a9c7dd'},{x:620,w:200,h:600,c:'#bfe0cf'},{x:810,w:300,h:540,c:'#e3c4a8'}];
function car(x,y,s,col='#d9493f'){
  return `<g transform="translate(${x},${y}) scale(${s})"><path d="M-150,-40 L-150,-80 Q-140,-100 -100,-104 L-60,-150 L70,-150 L120,-104 Q160,-100 165,-70 L165,-40Z" fill="${col}"/>
    <path d="M-48,-140 L-10,-140 L-10,-106 L-84,-106Z M2,-140 L62,-140 L104,-106 L2,-106Z" fill="#cfe6f5"/>${wheel(-88,-36,32,0)}${wheel(104,-36,32,0)}</g>`;
}
S.city=(t,D,B)=>{
  const E=EVS.city(B);
  let s=`<rect width="1080" height="1100" fill="url(#skyDay)"/>`+clouds(t,5,.9);
  for(const b of CITYB){s+=`<rect x="${b.x}" y="${800-b.h}" width="${b.w}" height="${b.h}" fill="${b.c}"/><rect x="${b.x}" y="${800-b.h}" width="${b.w}" height="14" fill="#000" opacity=".08"/>`;
    for(let c=0;c<Math.floor((b.w-30)/52);c++)for(let r=0;r<Math.floor((b.h-60)/74);r++) s+=`<rect x="${b.x+24+c*52}" y="${800-b.h+40+r*74}" width="30" height="44" rx="3" fill="#7fa6c9"/><rect x="${b.x+24+c*52}" y="${800-b.h+40+r*74}" width="30" height="8" fill="#fff" opacity=".35"/>`;}
  s+=`<rect y="800" width="1080" height="64" fill="#cfc8bf"/><rect y="860" width="1080" height="10" fill="#a9a29a"/><rect y="870" width="1080" height="230" fill="#5d6270"/>`;
  for(let i=0;i<8;i++) s+=`<rect x="${i*150+10}" y="975" width="90" height="10" rx="5" fill="#e8e8e8"/>`;
  // crashed car + bent lamppost + smoke
  s+=`<g transform="rotate(-14 690 862)"><rect x="684" y="560" width="12" height="302" fill="#4a4f60"/><rect x="664" y="548" width="52" height="18" rx="6" fill="#4a4f60"/></g>`;
  s+=`<g transform="rotate(-4 800 960)">${car(800,960,1.0)}</g>`;
  for(let i=0;i<6;i++){const p=(t*.8+i/6)%1;s+=`<circle cx="${680+p*40+Math.sin(i)*10}" cy="${850-p*240}" r="${18+p*40}" fill="#8a8f99" opacity="${((1-p)*.55).toFixed(2)}"/>`}
  // blind pedestrians
  s+=blindP(0,lerp(80,150,t/D),850,.5,t)+blindP(2,330,845,.48,t,{cane:true,aR:20})+blindP(3,520,860,.52,t);
  s+=blindP(4,970,1050,.66,t,{aL:110,aR:105});
  s+=bubble(110,520,'¿HOLA?',P(t,E.bub[0]))+bubble(370,500,'¡NO VEO!',P(t,E.bub[1]))+bubble(940,640,'¡AYUDA!',P(t,E.bub[2]));
  return cam(s,1.05,lerp(470,610,eIO(t/D)),600,540,600);
};
S.eyes=(t,D,B)=>{
  let s=`<defs><radialGradient id="eb" cx=".5" cy=".5" r=".7"><stop offset="0" stop-color="#2e3570"/><stop offset="1" stop-color="#131529"/></radialGradient></defs><rect width="1080" height="1100" fill="url(#eb)"/>`;
  const look=t<.35?[0,0]:t<.65?[-12,0]:t<.95?[12,0]:[0,1];
  s+=person({...LUCIA,x:540,y:590+412*2.5,s:2.5,look,brows:'up'});
  const a=P(t,.12,.25);
  s+=`<g opacity="${a}">${brackets(540,605,lerp(520,330,a),150,YEL,36,7)}</g>`+tag(540,400,'VISIÓN: 100%',GREEN,a);
  return cam(s,1+.06*t/D,540,600,540,600);
};
S.id=(t,D,B)=>{
  const E=EVS.id(B);
  let s=`<rect width="1080" height="1100" fill="#181b34"/>`;
  for(let x=0;x<=1080;x+=60) s+=`<line x1="${x}" y1="0" x2="${x}" y2="1100" stroke="#2a2f55" stroke-width="1.5" opacity=".45"/>`;
  for(let y=0;y<=1100;y+=60) s+=`<line x1="0" y1="${y}" x2="1080" y2="${y}" stroke="#2a2f55" stroke-width="1.5" opacity=".45"/>`;
  s+=person({...LUCIA,x:330,y:1000,s:1.15,look:t<1?[11,0]:[0,2],brows:'worried'});
  s+=brackets(330,690,400,680,BLUE,34,6);
  const sy=350+((t*.9)%1)*680;
  s+=`<rect x="130" y="${sy-30}" width="400" height="30" fill="${BLUE}" opacity=".12"/><line x1="130" y1="${sy}" x2="530" y2="${sy}" stroke="${BLUE}" stroke-width="4" opacity=".8"/>`;
  const ca=eOut(prog(t,.1,.35));
  let c=`<rect x="0" y="0" width="420" height="360" fill="#15172b" stroke="${YEL}" stroke-width="3.5"/><text x="28" y="52" font-family="${MONO}" font-weight="700" font-size="22" fill="#8a8fb0" letter-spacing="2">ID · 000001</text>`;
  c+=`<text x="26" y="156" font-family="Inter" font-weight="900" font-size="96" fill="#f7d23e">${'LUCÍA'.slice(0,Math.ceil(prog(t,.2,.5)*5))}</text>`;
  c+=`<text x="28" y="232" font-family="Inter" font-weight="900" font-size="62" fill="#fff" opacity="${prog(t,E.beeps[1],E.beeps[1]+.15)}">21 AÑOS</text>`;
  c+=`<g opacity="${prog(t,E.beeps[2]-.2,E.beeps[2])}"><text x="28" y="300" font-family="${MONO}" font-weight="700" font-size="22" fill="#8a8fb0" letter-spacing="2">ESTADO:</text><circle cx="148" cy="322" r="8" fill="${GREEN}"/><text x="166" y="331" font-family="${MONO}" font-weight="800" font-size="28" fill="${GREEN}" letter-spacing="2">PUEDE VER</text></g>`;
  s+=`<g opacity="${ca}" transform="translate(${600+(1-ca)*40},430)">${c}</g>`;
  return cam(s,1+.03*t/D);
};
S.tv=(t,D,B)=>{
  const E=EVS.tv(B);
  let s=`<rect width="1080" height="1100" fill="#c7b9ad"/>`;
  for(let i=0;i<14;i++) s+=`<rect x="${i*80}" y="0" width="40" height="1100" fill="#000" opacity=".03"/>`;
  s+=`<rect y="880" width="1080" height="220" fill="#9c7f66"/><rect x="200" y="690" width="680" height="200" rx="10" fill="#6b4a3a"/><rect x="220" y="710" width="300" height="60" rx="6" fill="#5a3d30"/><rect x="560" y="710" width="300" height="60" rx="6" fill="#5a3d30"/>`;
  s+=`<rect x="214" y="244" width="652" height="452" rx="20" fill="#17181f"/><defs><clipPath id="tvc"><rect x="238" y="268" width="604" height="404" rx="6"/></clipPath>
    <linearGradient id="news" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#244a8a"/><stop offset="1" stop-color="#0f1f3d"/></linearGradient></defs>`;
  let sc='';
  if(t<E.sw){
    sc+=`<rect x="238" y="268" width="604" height="404" fill="url(#news)"/>`;
    for(let i=0;i<6;i++) sc+=`<polygon points="${300+i*100},268 ${340+i*100},268 ${420+i*90},672 ${360+i*90},672" fill="#fff" opacity=".04"/>`;
    sc+=person({skin:'#e9b48e',top:'#2b2f45',topD:'#1c1f30',hs:'short',hair:'#4a3a32',x:540,y:440+412*.6,s:.6,glasses:'sun',mouth:Math.sin(t*14)>0?'o':'line'});
    sc+=`<rect x="330" y="560" width="420" height="112" fill="#d6dbe6"/><rect x="330" y="560" width="420" height="10" fill="#aeb6c6"/>`;
    sc+=`<rect x="258" y="286" width="170" height="36" rx="5" fill="#d9263f"/><text x="343" y="311" text-anchor="middle" font-family="${MONO}" font-weight="800" font-size="19" fill="#fff">NOTICIAS 24H</text>`;
    sc+=`<rect x="238" y="582" width="604" height="54" fill="#d9263f"/><text x="540" y="620" text-anchor="middle" font-family="Inter" font-weight="900" font-size="34" fill="#fff">CEGUERA MUNDIAL</text>`;
    const tk='8.000.000.000 AFECTADOS · SIN CAUSA CONOCIDA · NO SALGA DE CASA · ';
    sc+=`<rect x="238" y="636" width="604" height="36" fill="#0d1426"/><text x="${(840-((t*140)%700)).toFixed(0)}" y="661" font-family="${MONO}" font-weight="700" font-size="19" fill="#fff">${tk+tk}</text>`;
  } else {
    const u=t-E.sw, r=rng(Math.floor(t*30));
    sc+=`<rect x="238" y="268" width="604" height="404" fill="#0d0f1c"/>`;
    if(u<.18){for(let i=0;i<40;i++) sc+=`<rect x="238" y="${268+r()*404}" width="604" height="${2+r()*8}" fill="#fff" opacity="${(r()*.6).toFixed(2)}"/>`}
    else{const bl=(Math.floor(t*3)%2)?1:.82;
      sc+=`<rect x="256" y="286" width="568" height="368" fill="none" stroke="${YEL}" stroke-width="5" opacity="${bl}"/>`;
      sc+=`<text x="540" y="430" text-anchor="middle" font-family="Inter" font-weight="900" font-size="74" fill="#f7d23e">¿PUEDES VER?</text>`;
      sc+=`<text x="540" y="520" text-anchor="middle" font-family="Inter" font-weight="900" font-size="64" fill="#fff">PRESÉNTATE</text>`;
      sc+=`<text x="540" y="590" text-anchor="middle" font-family="${MONO}" font-weight="700" font-size="22" fill="#8a8fb0" letter-spacing="3">CENTRO DE EVALUACIÓN</text>`;}
  }
  s+=`<g clip-path="url(#tvc)">${sc}</g><rect x="238" y="268" width="604" height="404" fill="url(#vig)" opacity=".5"/>`;
  s+=`<ellipse cx="540" cy="470" rx="520" ry="420" fill="url(#tvglow)"/>`;
  s+=person({...LUCIA,x:960,y:1090,s:.86,look:[-12,-2],brows:'worried'});
  const zp=eIO(prog(t,E.sw-.1,E.sw+.8));
  return cam(s,lerp(1.0,1.32,zp)+.02*t/D,lerp(560,540,zp),lerp(600,470,zp),540,lerp(600,520,zp));
};
const CROWD=(()=>{const a=[];for(let r=0;r<13;r++){const k=.62+r*.035,y=170+r*68,dx=64*k;for(let x=540-Math.floor(560/dx)*dx;x<1100;x+=dx){if(Math.abs(x-540)<dx*.6&&Math.abs(y-578)<40)continue;a.push({x,y,k,d:Math.hypot(x-540,y-578)})}}return a})();
S.crowd=(t,D,B)=>{
  const E=EVS.crowd(B), maxD=760;
  let s=`<rect width="1080" height="1100" fill="#14162b"/>`;
  for(const c of CROWD){
    const lit=t>.15+c.d/maxD*1.3, red=t>E.red+(1-c.d/maxD)*1.0;
    const col=red?'#c4163f':lit?'#59639e':'#262b50';
    s+=`<g transform="translate(${c.x.toFixed(1)},${c.y}) scale(${c.k.toFixed(3)})"><circle cx="0" cy="-30" r="15" fill="${col}"/><path d="M-24,4 Q-24,-14 0,-14 Q24,-14 24,4Z" fill="${col}"/>${red?`<circle cx="-5" cy="-31" r="2.6" fill="#fff"/><circle cx="5" cy="-31" r="2.6" fill="#fff"/>`:''}</g>`;
  }
  const pu=.5+.5*Math.sin(t*6);
  s+=`<circle cx="540" cy="560" r="${30+pu*16}" fill="#ffd93d" opacity="${(.2+.15*pu).toFixed(2)}"/><circle cx="540" cy="560" r="13" fill="#ffd93d"/>`;
  s+=`<text x="540" y="618" text-anchor="middle" font-family="${MONO}" font-weight="800" font-size="22" fill="${YEL}" letter-spacing="2">LUCÍA</text>`;
  const rp=eOut(prog(t,E.red+.2,E.lock));
  if(rp>0){const R=lerp(300,70,rp);s+=`<g opacity="${rp}" stroke="${PINK}" stroke-width="5" fill="none"><circle cx="540" cy="560" r="${R}"/><circle cx="540" cy="560" r="${R*.55}" stroke-dasharray="10 10"/><line x1="${540-R-40}" y1="560" x2="${540-R*.4}" y2="560"/><line x1="${540+R*.4}" y1="560" x2="${540+R+40}" y2="560"/><line x1="540" y1="${560-R-40}" x2="540" y2="${560-R*.4}"/><line x1="540" y1="${560+R*.4}" x2="540" y2="${560+R+40}"/></g>`;}
  return cam(s,1+.14*eIO(t/D),540,560,540,560);
};
S.mirror=(t,D,B)=>{
  const E=EVS.mirror(B);
  let s=`<rect width="1080" height="1100" fill="#dde5ec"/>`;
  for(let i=0;i<12;i++) s+=`<rect x="${i*90}" y="0" width="2" height="1100" fill="#000" opacity=".04"/>`;
  s+=`<rect y="960" width="1080" height="140" fill="#aab5bf"/><rect y="952" width="1080" height="12" fill="#8f9ba6"/>`;
  const gl=prog(t,E.gl,E.gl+.35), hands=eOut(prog(t,E.tags[1],E.tags[1]+.3)), walking=t>E.tags[2];
  const pose={...LUCIA,s:1.05,glasses:gl>0?'sun':null,glassesY:(1-eOut(gl))*-90,glassesOp:gl,
    aL:lerp(14,95,hands),aR:lerp(14,92,hands),walk:walking?(t-E.tags[2])*3.5:null,tilt:walking?-4:0,look:[0,0]};
  // mirror + reflection
  s+=`<defs><clipPath id="mir"><rect x="660" y="250" width="330" height="700" rx="16"/></clipPath></defs>`;
  s+=`<rect x="644" y="234" width="362" height="732" rx="26" fill="#c9b28a"/><rect x="660" y="250" width="330" height="700" rx="16" fill="#c8dbe6"/>`;
  s+=`<g clip-path="url(#mir)"><g transform="translate(1650,0) scale(-1,1)" opacity=".85">${person({...pose,x:825,y:1030})}</g><rect x="660" y="250" width="330" height="700" fill="#bcd3e0" opacity=".25"/>
    <polygon points="700,250 760,250 660,420 660,330" fill="#fff" opacity=".35"/><polygon points="900,250 930,250 760,950 730,950" fill="#fff" opacity=".18"/></g>`;
  s+=person({...pose,x:360,y:1030});
  const a1=P(t,E.tags[0],.2),a2=P(t,E.tags[1],.2),a3=P(t,E.tags[2],.2);

    s+=`<rect x="22" y="186" width="330" height="${22+n*40}" rx="10" fill="#11131f" fill-opacity=".82"/>`;
