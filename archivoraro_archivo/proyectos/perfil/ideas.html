<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;width:800px;height:800px;overflow:hidden}</style></head>
<body><svg id="s" width="800" height="800" viewBox="0 0 800 800"></svg>
<script src="lib.js"></script>
<script>{
// Profile-picture concepts in the videos' style: flat fills, ringed eyes, HUD box in JetBrains Mono.
const CC=+(new URLSearchParams(location.search).get('c')||1);
const HUDY=YEL, NAVY=['#232a5e','#0a0c1c'];
const defs=`<defs>
  <radialGradient id="navy" cx="50%" cy="45%" r="72%"><stop offset="0" stop-color="${NAVY[0]}"/><stop offset="1" stop-color="${NAVY[1]}"/></radialGradient>
  <radialGradient id="dark" cx="50%" cy="50%" r="70%"><stop offset="0" stop-color="#1a1d33"/><stop offset="1" stop-color="#050609"/></radialGradient>
  <radialGradient id="glowY"><stop offset="0" stop-color="#ffd34a" stop-opacity=".55"/><stop offset="1" stop-color="#ffd34a" stop-opacity="0"/></radialGradient>
  <radialGradient id="lamp" cx="50%" cy="38%" r="70%"><stop offset="0" stop-color="#ffe9a8"/><stop offset=".6" stop-color="#f2c45a"/><stop offset="1" stop-color="#c98a2a"/></radialGradient>
  <linearGradient id="beam" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#ffd34a" stop-opacity=".9"/><stop offset="1" stop-color="#ffd34a" stop-opacity="0"/></linearGradient>
</defs>`;
const stars=(n,seed)=>{const R=rng(seed);let g='';for(let i=0;i<n;i++)g+=`<circle cx="${R()*800}" cy="${R()*800}" r="${1+R()*2}" fill="#fff" opacity="${.2+R()*.5}"/>`;return g};
// one ringed eye exactly like lib3's, at any size
const eye=(cx,cy,r,lx=0,ly=0,lid=0)=>{
  const k=r/25;
  let e=`<g transform="translate(${cx},${cy}) scale(${k})"><circle r="25" fill="#fff" stroke="${INK}" stroke-width="7"/>
    <circle cx="${lx}" cy="${ly}" r="11" fill="${INK}"/><circle cx="${lx+3.5}" cy="${ly-4}" r="3.2" fill="#fff"/>`;
  if(lid) e+=`<clipPath id="l${cx}${cy}"><circle r="28.5"/></clipPath><rect x="-30" y="-30" width="60" height="${lid}" fill="${INK}" clip-path="url(#l${cx}${cy})"/><path d="M-24,${lid-30} L24,${lid-30}" stroke="${INK}" stroke-width="7" stroke-linecap="round"/>`;
  return e+'</g>';
};
let g='';

if(CC===1){ // eyes in the dark
  g+=`<rect width="800" height="800" fill="url(#dark)"/>`;
  g+=`<ellipse cx="400" cy="400" rx="330" ry="170" fill="url(#glowY)" opacity=".28"/>`;
  for(const [cx,o] of [[275,-1],[525,1]]){
    g+=`<clipPath id="ey${cx}"><circle cx="${cx}" cy="410" r="104"/></clipPath><circle cx="${cx}" cy="410" r="104" fill="#fdfaf0"/>
      <g clip-path="url(#ey${cx})"><circle cx="${cx+34}" cy="430" r="46" fill="${INK}"/><circle cx="${cx+50}" cy="412" r="14" fill="#fff"/>
      <path d="M${cx-120},${o<0?318:374} L${cx+120},${o<0?374:318} L${cx+120},280 L${cx-120},280Z" fill="#07080d"/></g>`;
  }
}
if(CC===2){ // the HUD box with the channel name
  g+=`<rect width="800" height="800" fill="url(#navy)"/>`+stars(40,3);
  g+=`<rect x="100" y="226" width="600" height="348" fill="#11131f" fill-opacity=".92" stroke="${HUDY}" stroke-width="8"/>`;
  g+=`<circle cx="146" cy="272" r="16" fill="${PINK}"/>`;
  g+=`<text x="400" y="392" text-anchor="middle" font-family="${MONO}" font-weight="800" font-size="120" letter-spacing="8" fill="${HUDY}">SI UN</text>`;
  g+=`<text x="372" y="520" text-anchor="middle" font-family="${MONO}" font-weight="800" font-size="120" letter-spacing="8" fill="${HUDY}">DÍA…</text>`;
  g+=`<rect x="560" y="430" width="44" height="92" fill="${HUDY}"/>`;
}
if(CC===3){ // a door left ajar, light spilling out, eyes in the gap
  g+=`<rect width="800" height="800" fill="#141729"/><rect y="690" width="800" height="110" fill="#0d0f1c"/>`;
  g+=`<rect x="130" y="40" width="540" height="650" fill="#0a0b12"/>`;
  g+=`<path d="M350,690 L490,690 L800,800 L180,800Z" fill="url(#beam)" opacity=".5"/>`;
  g+=`<rect x="350" y="52" width="140" height="638" fill="#ffd34a"/><rect x="350" y="52" width="140" height="638" fill="#fff" opacity=".22"/>`;
  g+=eye(400,330,36,-9,3,7)+eye(458,330,36,-9,3,7);
  g+=`<path d="M350,52 L350,690 L110,740 L110,10Z" fill="#3a2f4a"/><path d="M350,52 L350,690 L326,695 L326,47Z" fill="#2a2236"/>`;
  g+=`<path d="M150,90 L300,72 L300,330 L150,340Z M150,420 L300,416 L300,640 L150,668Z" fill="#000" opacity=".12"/>`;
  g+=`<circle cx="138" cy="400" r="15" fill="#e8c547"/>`;
  g+=`<rect x="490" y="40" width="180" height="650" fill="#20233a"/><rect x="120" y="28" width="560" height="20" fill="#2a2e4a"/>`;
}
if(CC===4){ // keyhole with an eye behind it
  g+=`<rect width="800" height="800" fill="url(#lamp)"/>`;
  for(let i=0;i<12;i++){const a=i*Math.PI/6;g+=`<path d="M400,380 L${400+900*Math.cos(a-.08)},${380+900*Math.sin(a-.08)} L${400+900*Math.cos(a+.08)},${380+900*Math.sin(a+.08)}Z" fill="#fff" opacity=".12"/>`;}
  g+=`<rect x="190" y="140" width="420" height="560" rx="60" fill="#c79a3a"/><rect x="210" y="160" width="380" height="520" rx="48" fill="#e2b552"/>`;
  g+=`<path d="M400,210 a140,140 0 0 1 82,253 L520,640 L280,640 L318,463 A140,140 0 0 1 400,210Z" fill="#0b0c14"/>`;
  g+=`<clipPath id="kh"><path d="M400,210 a140,140 0 0 1 82,253 L520,640 L280,640 L318,463 A140,140 0 0 1 400,210Z"/></clipPath>`;
  g+=`<g clip-path="url(#kh)">${eye(400,350,104,-4,6,22)}</g>`;
}
if(CC===5){ // the shadow kid: a lib3 person drawn as a shadow on a lamp-lit wall
  g+=`<rect width="800" height="800" fill="url(#lamp)"/>`;
  g+=person({tall:true,skin:'#16141f',hs:'messy',hair:'#16141f',top:'#16141f',topD:'#16141f',pants:'#16141f',eyes:'open',look:[6,3],mouth:'jag',blush:false,still:true,blink:false,x:400,y:400+638*2.05,s:2.05,noShadow:true});
}
if(CC===6){ // a «?» mascot with lib3 eyes
  g+=`<rect width="800" height="800" fill="url(#navy)"/>`+stars(40,9);
  g+=`<circle cx="400" cy="400" r="300" fill="url(#glowY)" opacity=".5"/>`;
  g+=`<text x="400" y="640" text-anchor="middle" font-family="${MONO}" font-weight="800" font-size="620" fill="${HUDY}">?</text>`;
  g+=eye(350,300,48,-9,-3)+eye(452,300,48,-9,-3);
}
document.getElementById('s').innerHTML=defs+tintDefs()+g;
}</script></body></html>
