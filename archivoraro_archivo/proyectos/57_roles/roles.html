<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:#000}#st{position:relative;width:1080px;height:1920px;overflow:hidden}canvas,svg{position:absolute;left:0;top:0}</style></head>
<body><div id="st"><canvas id="gl" width="1080" height="1920"></canvas><svg id="sv" width="1080" height="1920" viewBox="0 0 1080 1920"></svg></div>
<script src="three_post.js"></script><script src="util3d.js"></script><script src="world3d.js"></script><script src="stick.js"></script><script src="hair.js"></script>
<script>
const MIL = { outfit: 'military', top: '#6b7448', topD: '#3f4428', hat: 'helmet', hair2: 'buzz', hairCol: '#3a2a1e', medals: true, nameTape: 'RAMOS', shoes: '#2c2620', sole: '#15151a', belly: 1.1, face: 'angry', mouth: 'line', brows: -1, browTilt: .9 };
const CHEF = { outfit: 'chef', top: '#f8f6f0', topD: '#d6d2c6', hat: 'toque', hair2: 'side', hairCol: '#2a1a12', mustache: '#2a1a12', prop: 'pan', apron: '#2a2d36', scarf: '#d63c2f', shoes: '#2a2c34', sole: '#f4f2ec', belly: 1.28, face: 'happy', mouth: 'laugh' };
const ABU = { outfit: 'cardigan', top: '#b98a4e', topD: '#8a6232', shirt: '#bcd6ee', hair2: 'bald', hairCol: '#eeeeee', glasses: true, mustache: '#f4f4f4', browCol: '#f4f4f4', wrinkles: true, cane: '#7a4a26', shoes: '#4a3424', sole: '#2a2a2a', belly: 1.15, face: 'open', mouth: 'line', lean: 4 };
W2.charLight = { tint: '#ffe2bd', k: .14, rim: '#fff6e6', rimA: .5, rimX: -1, rimY: -.6 };
const SP = [[MIL, -1.45, -10.6, { armL: [10, 5], armR: [10, 5], legL: [6, 0], legR: [6, 0] }], [CHEF, .2, -10.3, { armL: [20, 30], armR: [40, 70] }], [ABU, 1.75, -10.6, { armL: [12, 10], armR: [16, 20], legL: [4, 8], legR: [6, 10] }]];
window.shot = function (n) { const W = W2; W.floaters(0); W.setNet(0, 0); W.BALL.position.set(2.6, .12, -9.4); let s = '';
  if (n === 0) { W.setCam(V3(.2, 1.25, -1.2), V3(.15, .95, -10.4), 46, 9.3, .0015); W.render();
    SP.slice().sort((a, b) => a[2] - b[2]).forEach(([c, x, z, pose]) => { const H = c === ABU ? 1.5 : 1.66; s += stickAt(Object.assign({}, c, pose), V3(x, 0, z), V3(x + (c === ABU ? .05 : 0), H, z), W); }); }
  else { const [c, x, z, pose] = SP[n - 1], H = c === ABU ? 1.5 : 1.66; W.setCam(V3(x + .15, H - .1, z + 2.6), V3(x, H - .45, z), 34, 2.65, .005); W.render();
    SP.forEach(([c2, x2, z2, p2]) => { if (c2 !== c) s += stickAt(Object.assign({}, c2, p2), V3(x2, 0, z2), V3(x2, c2 === ABU ? 1.5 : 1.66, z2), W, { blur: 7 }); });
    s += stickAt(Object.assign({}, c, pose), V3(x, 0, z), V3(x + (c === ABU ? .05 : 0), H, z), W); }
  document.getElementById('sv').innerHTML = s; };
document.title = 'ready';
</script></body></html>
