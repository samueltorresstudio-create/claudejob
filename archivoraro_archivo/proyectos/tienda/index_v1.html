<!doctype html>
<html><head><meta charset="utf-8">
<style>
html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:#12131f}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden;background:#12131f}
svg{position:absolute;left:0;top:0}
#cap{position:absolute;left:46px;right:46px;top:1185px;text-align:center;font-family:'Inter';font-weight:900;
  line-height:1.0;letter-spacing:-2px;color:#fff;text-transform:uppercase}
.w{display:inline-block;margin:0 .02em;transform-origin:50% 75%;text-shadow:0 6px 0 rgba(0,0,0,.28)}
</style></head>
<body><div id="stage">
<svg id="scene" width="1080" height="1920" viewBox="0 0 1080 1920"></svg>
<div id="cap"></div>
<svg id="hud" width="1080" height="1920" viewBox="0 0 1080 1920"></svg>
</div>
<script src="lib.js"></script>
<script src="voice.js"></script>
<script>
// ---------- cast ----------
const A=o=>person(Object.assign({tall:true},o));
const CLARA={skin:'#f6d2b5',top:'#d9536f',topD:'#a83a52',pants:'#3b4a7a',hs:'bun',hair:'#c06a3a',lashes:true};
const STAFF={skin:'#efe3d6',top:'#2f7d5c',topD:'#1f5a42',pants:'#2a2d36',hs:'short',hair:'#2a2420'};
const SH=-524, ARM=205;
function handPos(x,y,s,a,side=1){return[x+side*(84+ARM*Math.sin(rad(a)))*s,y+(SH+ARM*Math.cos(rad(a)))*s]}
function staff(o){ // employee + name badge
  const s=o.s||1, x=o.x, y=o.y;
  return A({...STAFF,...o})+`<rect x="${(x+30*s).toFixed(1)}" y="${(y-480*s).toFixed(1)}" width="${44*s}" height="${22*s}" rx="${3*s}" fill="#f4f1ea"/>`;
}
const N=(c)=>L('dusk',c), NC=(c)=>C('dusk',c); // night grading for set / characters

// ---------- furniture & set ----------
function clockFace(cx,cy,r,hh,mm,ss,frame='#3a3f4e'){
  let s=`<circle cx="${cx}" cy="${cy}" r="${r*1.13}" fill="${frame}"/><circle cx="${cx}" cy="${cy}" r="${r}" fill="#fbf8f0"/>`;
  for(let k=0;k<12;k++){const a=rad(k*30);s+=`<line x1="${(cx+Math.sin(a)*r*.8).toFixed(1)}" y1="${(cy-Math.cos(a)*r*.8).toFixed(1)}" x2="${(cx+Math.sin(a)*r*.93).toFixed(1)}" y2="${(cy-Math.cos(a)*r*.93).toFixed(1)}" stroke="${INK}" stroke-width="${r*.055}" stroke-linecap="round"/>`}
  const hand=(a,l,w,c)=>`<line x1="${cx}" y1="${cy}" x2="${(cx+Math.sin(rad(a))*r*l).toFixed(1)}" y2="${(cy-Math.cos(rad(a))*r*l).toFixed(1)}" stroke="${c}" stroke-width="${r*w}" stroke-linecap="round"/>`;
  s+=hand(((hh%12)+mm/60)*30,.5,.075,INK)+hand((mm+ss/60)*6,.74,.05,INK)+hand(ss*6,.84,.022,'#e2453b');
  return s+`<circle cx="${cx}" cy="${cy}" r="${r*.07}" fill="#e2453b"/>`;
}
function bed(x,y,s,o={}){
  const {duvet='#6fa8dc',lump=0,breath=0,lift=0}=o, h=lump*(88+breath*20);
  let g=`<rect x="-200" y="-270" width="400" height="200" rx="20" fill="#8a6a52"/><rect x="-180" y="-250" width="360" height="160" rx="14" fill="#9c7a60"/>`;
  g+=`<rect x="-212" y="-92" width="424" height="70" rx="10" fill="#7a5a44"/><rect x="-196" y="-24" width="22" height="28" fill="#5a4030"/><rect x="174" y="-24" width="22" height="28" fill="#5a4030"/>`;
  g+=`<rect x="-200" y="-134" width="400" height="60" rx="16" fill="#f4f1ea"/><ellipse cx="-92" cy="-146" rx="80" ry="26" fill="#fff"/><ellipse cx="92" cy="-146" rx="80" ry="26" fill="#fff"/>`;
  g+=`<path d="M-216,-120 Q-130,${(-120-h*.25).toFixed(1)} -60,${(-120-h*.65).toFixed(1)} Q0,${(-120-h).toFixed(1)} 70,${(-120-h*.6).toFixed(1)} Q140,-122 216,-120 L216,${(-40-lift*30).toFixed(1)} Q0,${(-30-lift*60).toFixed(1)} -216,${(-40-lift*30).toFixed(1)}Z" fill="${duvet}"/>`;
  g+=`<path d="M-150,-100 Q-60,-${(96+h*.3).toFixed(1)} 30,-98 M60,-80 Q130,-84 190,-78" stroke="#fff" stroke-width="5" opacity=".25" fill="none"/>`;
  if(lift>0) g+=`<path d="M-200,-36 Q0,${(-24-lift*60).toFixed(1)} 200,-36 Q0,-20 -200,-36Z" fill="#05060a"/>`;
  return `<g transform="translate(${x},${y}) scale(${s})">${g}</g>`;
}
function priceTag(x,y,txt,s=1){return `<g transform="translate(${x},${y}) scale(${s})"><rect x="-58" y="-24" width="116" height="48" rx="6" fill="#f2d24b"/><text x="0" y="10" text-anchor="middle" font-family="Inter" font-weight="900" font-size="26" fill="#1f2a3a">${txt}</text></g>`}
function wardrobe(x,y,s,open=0,inside=''){
  let g=`<rect x="-130" y="-560" width="260" height="560" rx="6" fill="#f4f1ea"/><rect x="-130" y="-560" width="260" height="24" fill="#e2ddd2"/>`;
  g+=`<rect x="-118" y="-530" width="236" height="510" fill="#2a2420"/>${inside}`;
  g+=`<rect x="2" y="-530" width="116" height="510" fill="#f9f7f2" stroke="#d9d3c6" stroke-width="3"/><rect x="14" y="-300" width="8" height="70" rx="4" fill="#b9b2a5"/>`;
  const w=116*(1-open*.85);
  g+=`<rect x="${-118}" y="-530" width="${w.toFixed(1)}" height="510" fill="#f9f7f2" stroke="#d9d3c6" stroke-width="3"/><rect x="${(-118+w-22).toFixed(1)}" y="-300" width="8" height="70" rx="4" fill="#b9b2a5"/>`;
  return `<g transform="translate(${x},${y}) scale(${s})">${g}</g>`;
}
function floorLamp(x,y,s,lit=0){
  let g=`<ellipse cx="0" cy="0" rx="46" ry="12" fill="#3a3f4e"/><rect x="-5" y="-420" width="10" height="420" fill="#4a4f60"/><path d="M-70,-400 L70,-400 L44,-500 L-44,-500Z" fill="${lit?'#ffe1a1':'#e9dcc4'}"/>`;
  if(lit) g+=`<circle cx="0" cy="-420" r="260" fill="url(#glowY)" opacity="${lit}"/><polygon points="-60,-400 60,-400 220,0 -220,0" fill="#ffd76a" opacity="${(.12*lit).toFixed(2)}"/>`;
  return `<g transform="translate(${x},${y}) scale(${s})">${g}</g>`;
}
function sofa(x,y,s,c='#7a8fb0'){return `<g transform="translate(${x},${y}) scale(${s})"><rect x="-170" y="-150" width="340" height="90" rx="26" fill="${mix(c,'#000000',.15)}"/><rect x="-190" y="-80" width="380" height="64" rx="20" fill="${c}"/><rect x="-200" y="-120" width="50" height="104" rx="20" fill="${mix(c,'#000000',.1)}"/><rect x="150" y="-120" width="50" height="104" rx="20" fill="${mix(c,'#000000',.1)}"/><rect x="-170" y="-16" width="16" height="16" fill="#3a3027"/><rect x="154" y="-16" width="16" height="16" fill="#3a3027"/></g>`}
function shelfUnit(x,y,s){let g=`<rect x="-110" y="-420" width="220" height="420" fill="#c9a77e"/>`;for(let k=0;k<4;k++)g+=`<rect x="-100" y="${-410+k*100}" width="200" height="88" fill="#6b5240"/>`;
  const r=rng(Math.round(x));for(let k=0;k<4;k++)for(let j=0;j<3;j++) g+=`<rect x="${-90+j*62}" y="${-380+k*100}" width="${30+r()*20}" height="${40+r()*18}" fill="${['#e2453b','#f2c230','#6fa8dc','#45a86b','#f4f1ea'][Math.floor(r()*5)]}"/>`;
  return `<g transform="translate(${x},${y}) scale(${s})">${g}</g>`}
function exitSign(x,y,s=1,txt='SALIDA'){return `<g transform="translate(${x},${y}) scale(${s})"><rect x="-90" y="-30" width="180" height="60" rx="6" fill="#1f8f4e"/><text x="0" y="12" text-anchor="middle" font-family="${MONO}" font-weight="800" font-size="28" fill="#eaffef">${txt}</text><ellipse cx="0" cy="40" rx="140" ry="40" fill="#3fe07e" opacity=".08"/></g>`}
function speaker(x,y,s,on=0,t=0){
  let g=`<rect x="-8" y="-60" width="16" height="50" fill="#5a6070"/><path d="M-40,-14 L40,-14 L70,40 L-70,40Z" fill="#8a93a3"/><ellipse cx="0" cy="40" rx="70" ry="16" fill="#5a6070"/><ellipse cx="0" cy="40" rx="48" ry="10" fill="#2a2f3c"/>`;
  if(on>0) for(let i=0;i<3;i++){const p=(t*1.4+i/3)%1,r=60+p*220;g+=`<path d="M${-r},${60+p*40} Q0,${60+r*.7} ${r},${60+p*40}" fill="none" stroke="#cfe0ff" stroke-width="6" opacity="${((1-p)*on).toFixed(2)}"/>`}
  return `<g transform="translate(${x},${y}) scale(${s})">${g}</g>`;
}
function nightRoom(t,o={}){
  let s=`<rect width="1080" height="1100" fill="#2a3450"/><rect width="1080" height="170" fill="#1a2133"/>`;
  for(let i=0;i<4;i++) s+=`<rect x="${90+i*250}" y="30" width="150" height="46" fill="#6d82b3"/><polygon points="${90+i*250},76 ${240+i*250},76 ${330+i*250},1100 ${20+i*250},1100" fill="#9fb6ff" opacity=".05"/>`;
  s+=`<rect y="860" width="1080" height="240" fill="#353d55"/>`;for(let x=-200;x<1300;x+=120) s+=`<line x1="${x}" y1="860" x2="${x+(x-540)*.5}" y2="1100" stroke="#2c3349" stroke-width="3"/>`;
  if(o.furniture!==false){s+=shelfUnit(110,860,.9)+shelfUnit(970,860,.9)+sofa(320,880,.7,'#8a6fb0')+sofa(760,880,.7,'#5f8fa8')}
  return s;
}
function arrowFloor(t,o={}){ // perspective walkway with painted arrows
  let s=`<rect width="1080" height="1100" fill="#2a3450"/><rect width="1080" height="160" fill="#1a2133"/><polygon points="0,1100 1080,1100 620,560 460,560" fill="#353d55"/>`;
  for(let k=-6;k<=6;k++) s+=`<line x1="${540+k*14}" y1="560" x2="${540+k*190}" y2="1100" stroke="#2c3349" stroke-width="2"/>`;
  const sh=o.shift||0;
  [[-1,.15,'#8a6fb0'],[1,.25,'#5f8fa8'],[-1,.45,'#c9a77e'],[1,.6,'#7a8fb0'],[-1,.8,'#b0705a']].forEach(([side,u,c],i)=>{
    const y=lerp(600,1000,u), sc=lerp(.25,.85,u), x=540+side*lerp(150,470,u)+Math.sin(sh*6+i*2)*sh*90*side;
    s+=i%2?sofa(x,y,sc,c):shelfUnit(x,y,sc);});
  const n=9;
  for(let i=0;i<n;i++){const u=Math.pow(i/n,1.5), y=lerp(585,1080,u), sz=lerp(.12,1.3,u), lit=o.lit?o.lit(i):0, rot=o.rot?o.rot(i):0;
    s+=`<g transform="translate(540,${y.toFixed(1)}) scale(${sz.toFixed(3)},${(sz*.38).toFixed(3)}) rotate(${rot})"><polygon points="-70,-40 0,30 70,-40 70,-10 0,60 -70,-10" fill="${lit?'#7dffb0':'#e9edf5'}" opacity="${lit?1:.75}"/></g>`;
    if(lit) s+=`<ellipse cx="540" cy="${y.toFixed(1)}" rx="${(110*sz).toFixed(1)}" ry="${(40*sz).toFixed(1)}" fill="#3fe07e" opacity=".18"/>`;}
  return s;
}

// ---------- scene key times (scene-relative) ----------
const EVS={
  outside:B=>({push:B[2].s}),
  id:B=>({beeps:[.15,B[0].w[1],B[0].lead+B[0].vdur]}),
  wardrobe:B=>({out:B[1].s+.15,off:B[1].w[7]}),
  pa:B=>({voice:B[1].s+B[1].lead,voiceEnd:B[1].s+B[1].lead+B[1].vdur,staff:B[2].w[3]}),
  sign:B=>({}),
  beds:B=>({lump:B[2].w[4],walk:B[3].s,breathe:B[3].w[8]}),
  arrows:B=>({off:B[1].w[2],change:B[1].w[7]}),
  kitchen:B=>({passes:[0,B[0].d/3,2*B[0].d/3]}),
  name:B=>({pa:B[1].s+B[1].lead,paEnd:B[1].s+B[1].lead+B[1].vdur,cover:B[2].w[2]}),
  staff:B=>({spin:B[1].s,not:B[1].w[8]}),
  lamps:B=>({polo:B[1].w[4]}),
  smile:B=>({blinks:[B[1].w[5]+.25,B[1].w[8],B[1].w[10]]}),
  follow:B=>({exit:B[2].s,dorm:B[3].s}),
  bed2:B=>({move:B[1].w[4],hand:B[2].s}),
};

// ---------- scenes ----------
const S={};
S.outside=(t,D,B)=>{
  const E=EVS.outside(B);
  let s=sky('night')+stars(7,70,330,t)+moon(900,150);
  s+=`<rect x="70" y="330" width="940" height="420" fill="#1f4a3a"/><rect x="70" y="330" width="940" height="40" fill="#163829"/><rect x="70" y="700" width="940" height="50" fill="#d8d2c0"/>`;
  const fl=rng(Math.floor(t*12))()<.15?.35:1;
  s+=`<text x="540" y="520" text-anchor="middle" font-family="Inter" font-weight="900" font-size="128" letter-spacing="12" fill="#e8e2d0" opacity="${(.85*fl).toFixed(2)}">NORDHEM</text>`;
  s+=`<rect x="410" y="560" width="260" height="190" fill="#0e1622"/><rect x="536" y="560" width="8" height="190" fill="#3a4a5a"/><rect x="404" y="554" width="272" height="10" fill="#3a4a5a"/>`;
  // Clara pressed against the glass, inside
  const ca=prog(t,E.push+.2,E.push+.8);
  s+=`<g opacity="${ca.toFixed(2)}">${NC(A({...CLARA,x:470,y:760,s:.27,aL:165,aR:165,eyes:'wide',brows:'up',mouth:'o'}))}</g>`;
  s+=`<rect x="410" y="560" width="260" height="190" fill="#9fc3e8" opacity=".12"/><polygon points="420,560 470,560 420,660" fill="#fff" opacity=".12"/>`;
  s+=`<rect y="750" width="1080" height="350" fill="#2a2f3c"/>`;
  for(let i=0;i<9;i++) s+=`<path d="M${60+i*120},790 L${30+i*130},1100" stroke="#e8e2d0" stroke-width="5" opacity=".35"/>`;
  for(const [lx,flick] of [[160,0],[920,1]]){const on=flick&&rng(Math.floor(t*8)+3)()<.2?.2:1;
    s+=`<ellipse cx="${lx}" cy="1000" rx="200" ry="50" fill="#ffd76a" opacity="${(.12*on).toFixed(2)}"/><rect x="${lx-6}" y="640" width="12" height="360" fill="#3a3f4e"/><rect x="${lx-30}" y="626" width="60" height="18" rx="6" fill="#3a3f4e"/><rect x="${lx-22}" y="642" width="44" height="6" fill="#ffe9a6" opacity="${on}"/>`;}
  const zp=eIO(prog(t,E.push,D));
  return cam(s,lerp(1.0,2.2,zp)+.02*t/D,lerp(540,520,zp),lerp(620,660,zp),540,lerp(620,600,zp));
};
S.id=(t,D,B)=>{
  const E=EVS.id(B);
  let s=`<rect width="1080" height="1100" fill="#181b34"/>`;
  for(let x=0;x<=1080;x+=60) s+=`<line x1="${x}" y1="0" x2="${x}" y2="1100" stroke="#2a2f55" stroke-width="1.5" opacity=".45"/>`;
  for(let y=0;y<=1100;y+=60) s+=`<line x1="0" y1="${y}" x2="1080" y2="${y}" stroke="#2a2f55" stroke-width="1.5" opacity=".45"/>`;
  s+=A({...CLARA,x:320,y:1050,s:.93,look:t<1?[11,0]:[0,2],brows:'worried'});
  s+=brackets(320,660,400,780,BLUE,34,6);
  const sy=270+((t*.9)%1)*780;
  s+=`<rect x="120" y="${sy-30}" width="400" height="30" fill="${BLUE}" opacity=".12"/><line x1="120" y1="${sy}" x2="520" y2="${sy}" stroke="${BLUE}" stroke-width="4" opacity=".8"/>`;
  const ca=eOut(prog(t,.1,.35));
  let c=`<rect x="0" y="0" width="430" height="360" fill="#15172b" stroke="${YEL}" stroke-width="3.5"/><text x="28" y="52" font-family="${MONO}" font-weight="700" font-size="22" fill="#8a8fb0" letter-spacing="2">CLIENTE · 22:04</text>`;
  c+=`<text x="26" y="156" font-family="Inter" font-weight="900" font-size="100" fill="#f7d23e">${'CLARA'.slice(0,Math.ceil(prog(t,.2,.5)*5))}</text>`;
  c+=`<text x="28" y="232" font-family="Inter" font-weight="900" font-size="62" fill="#fff" opacity="${prog(t,E.beeps[1],E.beeps[1]+.15)}">20 AÑOS</text>`;
  c+=`<g opacity="${prog(t,E.beeps[2]-.2,E.beeps[2])}"><text x="28" y="300" font-family="${MONO}" font-weight="700" font-size="22" fill="#8a8fb0" letter-spacing="2">ESTADO:</text><circle cx="148" cy="322" r="8" fill="${PINK}"/><text x="166" y="331" font-family="${MONO}" font-weight="800" font-size="27" fill="${PINK}" letter-spacing="2">ENCERRADA</text></g>`;
  s+=`<g opacity="${ca}" transform="translate(${600+(1-ca)*40},420)">${c}</g>`;
  return cam(s,1+.03*t/D);
};
S.wardrobe=(t,D,B)=>{
  const E=EVS.wardrobe(B), dark=prog(t,E.off,E.off+.06), out=eIO(prog(t,E.out,E.out+.9));
  let s=`<rect width="1080" height="1100" fill="#efe6d8"/><rect width="1080" height="150" fill="#e2d8c6"/>`;
  for(let i=0;i<4;i++) s+=`<rect x="${70+i*260}" y="112" width="200" height="16" rx="8" fill="#fffbe8"/>`;
  s+=`<rect y="900" width="1080" height="200" fill="#d9cdb8"/>`;
  s+=wardrobe(220,900,.95)+wardrobe(860,900,.95)+priceTag(220,330,'199 €',.9)+priceTag(860,330,'249 €',.9);
  const inside=out<.05?A({...CLARA,x:-40,y:-20,s:.62,look:[14,0],mouth:'smile'}):'';
  s+=wardrobe(540,900,.95,lerp(.25,1,out),inside)+priceTag(540,330,'219 €',.9);
  const fr=1-prog(t,0,B[0].d);
  if(fr>0) s+=`<g opacity="${fr.toFixed(2)}">${A({skin:'#d9a57f',top:'#4f6fa0',topD:'#3a5070',hs:'short',hair:'#3a2a26',x:lerp(960,1180,1-fr),y:960,s:.42,walk:t*4,mouth:'smile'})}${A({skin:'#f1c7a5',top:'#45a86b',topD:'#2f7a4c',hs:'long',hair:'#6b4428',lashes:true,x:lerp(1040,1260,1-fr),y:965,s:.42,walk:t*4+1,mouth:'smile'})}</g>`;
  if(out>=.05) s+=A({...CLARA,x:lerp(500,560,out),y:lerp(880,1050,out),s:lerp(.62,.82,out),walk:out<1?t*4:null,look:dark>0?[0,-8]:[-8,0],eyes:dark>0?'wide':'open',brows:dark>0?'up':null,mouth:dark>0?'o':'line'});
  if(dark>0){s+=`<rect width="1080" height="1100" fill="#0b1020" opacity="${(.82*dark).toFixed(2)}"/>`;
    s+=`<text x="540" y="210" text-anchor="middle" font-family="Inter" font-weight="900" font-size="60" fill="#fff" opacity="${(1-prog(t,E.off+.25,E.off+.6)).toFixed(2)}">¡CLAC!</text>`+exitSign(900,220,.9);}
  return cam(s,1+.04*t/D,540,640,540,640);
};
S.pa=(t,D,B)=>{
  const E=EVS.pa(B), on=prog(t,E.voice,E.voice+.1)*(1-prog(t,E.voiceEnd,E.voiceEnd+.2));
  let s=N(nightRoom(t)+`<rect x="760" y="640" width="260" height="120" fill="#c9cfd8"/><rect x="740" y="760" width="300" height="100" fill="#9aa3b5"/><rect x="800" y="560" width="180" height="50" rx="6" fill="#2f7d5c"/><text x="890" y="595" text-anchor="middle" font-family="${MONO}" font-weight="800" font-size="26" fill="#fff">CAJAS</text>`);
  s+=exitSign(140,230,.85)+speaker(540,230,1.3,on,t);
  s+=NC(A({...CLARA,x:470,y:1060,s:.84,look:[2,-12],brows:'worried',mouth:on>0?'o':'line'}));
  const a=P(t,E.staff,.25);
  s+=`<g opacity="${a}">${brackets(890,710,330,330,PINK,24,5)}</g>`+tag(890,500,'EMPLEADOS: 0',PINK,a);
  const zp=eIO(prog(t,0,E.voice+1));
  return cam(s,lerp(1,1.12,zp)+.02*t/D,540,lerp(640,520,zp),540,lerp(640,560,zp));
};
S.sign=(t,D,B)=>{
  let board=`<rect width="1080" height="1100" fill="#3a4560"/><rect x="0" y="0" width="1080" height="1100" fill="url(#vig)"/>`;
  let p=`<rect x="0" y="0" width="720" height="560" rx="6" fill="#f7f3e8"/><rect x="0" y="0" width="720" height="110" rx="6" fill="#c4163f"/><rect x="0" y="80" width="720" height="30" fill="#c4163f"/>`;
  p+=`<text x="360" y="72" text-anchor="middle" font-family="Inter" font-weight="900" font-size="58" fill="#fff">NORMAS</text><text x="360" y="160" text-anchor="middle" font-family="${MONO}" font-weight="800" font-size="24" fill="#c4163f" letter-spacing="3">PARA CLIENTES NOCTURNOS</text>`;
  ['1. No te tumbes en las camas.','2. Sigue siempre las flechas.','3. Si oyes tu nombre, no contestes.','4. Los empleados se van a las 21:00.'].forEach((l,i)=>p+=`<text x="50" y="${250+i*80}" font-family="Inter" font-weight="800" font-size="34" fill="#1f2a3a">${l}</text>`);
  p+=`<rect x="-20" y="-14" width="90" height="34" fill="#e9dcae" opacity=".85" transform="rotate(-20)"/><rect x="660" y="-24" width="90" height="34" fill="#e9dcae" opacity=".85" transform="rotate(18 700 0)"/>`;
  const sign=`<g transform="translate(540,580) rotate(-2) translate(-360,-280)">${p}</g>`;
  let s=L('night',board+sign);
  const bx=lerp(300,760,eIO(prog(t,.1,D*.55))), by=lerp(430,700,eIO(prog(t,.1,D*.8)));

// ---------- timeline from the narration ----------
function wordTimes(b){
  const ws=b.cap.split(' ').map(w=>w.split('|')[0]);
  const wt=ws.map(w=>w.replace(/[^A-Za-zÁÉÍÓÚÜÑáéíóúüñ0-9]/g,'').length+1.5);
  const tot=wt.reduce((a,c)=>a+c,0);let acc=0;
  return ws.map((w,i)=>{const s=b.lead+b.vdur*.97*acc/tot;acc+=wt[i];return s});
}
const P=(t,a,d=.3)=>eOut(prog(t,a,a+d));
const BEATS=SCRIPT.map((l,i)=>Object.assign({},l,VOICE.beats[i]));
let sceneStart=0;
BEATS.forEach((b,i)=>{if(i===0||BEATS[i-1].sc!==b.sc)sceneStart=b.start;b.sStart=sceneStart;b.wt=wordTimes(b);});
BEATS.forEach(b=>{b.sDur=BEATS.filter(x=>x.sStart===b.sStart).reduce((a,x)=>a+x.d,0);b.B=BEATS.filter(x=>x.sStart===b.sStart).map(x=>({s:x.start-b.sStart,d:x.d,lead:x.lead,vdur:x.vdur,w:x.wt.map(w=>w+x.start-b.sStart)}))});
const TOTAL=VOICE.total, CUT=TOTAL-VOICE.tail; window.TOTAL=TOTAL;
const evAbs={};
BEATS.filter(b=>b.start===b.sStart).forEach(b=>{const E=EVS[b.sc](b.B);for(const k in E){const v=E[k];evAbs[b.sc+'.'+k]=Array.isArray(v)?v.map(x=>x+b.sStart):v+b.sStart}});
window.EVENTS={total:TOTAL,cut:CUT,ev:evAbs,beats:BEATS.map(b=>({start:b.start,d:b.d,sc:b.sc,cut:b.start===b.sStart,words:b.wt.map(w=>w+b.start),step:b.step??null,voice:b.voice||null,lead:b.lead,vdur:b.vdur}))};
const STEPS=['1. NO TUMBARSE','2. SEGUIR FLECHAS','3. NO CONTESTAR','4. NO HAY EMPLEADOS'];
const stepStart=STEPS.map((_,i)=>BEATS.find(b=>b.step===i).start), listEnd=BEATS.find(b=>b.sc==='smile').start;

function hudSvg(text,alert,reveal,T){
  const col=alert?PINK:YEL;
  const w=Math.max(500,text.length*24+140),x=540-w/2,y=92;
  let s=`<rect x="${x}" y="${y}" width="${w}" height="76" fill="#11131f" fill-opacity=".9" stroke="${col}" stroke-width="3"/>`;
  s+=`<circle cx="${x+32}" cy="${y+38}" r="8" fill="${PINK}" opacity="${(Math.floor(T*2)%2)?.25:1}"/>`;
  s+=`<text x="540" y="${y+50}" text-anchor="middle" font-family="${MONO}" font-weight="700" font-size="34" letter-spacing="4" fill="${col}">${text.slice(0,Math.ceil(text.length*reveal))}</text>`;
  if(T>=stepStart[0]&&T<listEnd){
    const n=stepStart.filter(st=>T>=st).length;
    s+=`<rect x="22" y="186" width="400" height="${22+n*40}" rx="10" fill="#11131f" fill-opacity=".82"/>`;
    for(let i=0;i<n;i++){const a=prog(T,stepStart[i]+.15,stepStart[i]+.4),done=i<n-1;
      s+=`<text x="40" y="${222+i*40}" font-family="${MONO}" font-weight="700" font-size="26" letter-spacing="2" fill="${done?GREEN:YEL}">${STEPS[i].slice(0,Math.ceil(STEPS[i].length*a))}${done?' ✓':''}</text>`;}
  }
  return s;
}
const BAND={outside:'#0f1220',id:'#14162b',wardrobe:'#161a26',pa:'#121626',sign:'#121626',beds:'#121626',arrows:'#121626',kitchen:'#121626',name:'#121626',staff:'#14161f',lamps:'#100f18',smile:'#0d0c12',follow:'#121626',bed2:'#0b0c12'};
const scEl=document.getElementById('scene'),hudEl=document.getElementById('hud'),capEl=document.getElementById('cap'),stEl=document.getElementById('stage');
window.render=function(T){
  if(T>=CUT){stEl.style.background='#000';scEl.innerHTML='';hudEl.innerHTML='';capEl.innerHTML='';return;}
  let bi=BEATS.findIndex(b=>T>=b.start&&T<b.start+b.d); if(bi<0) bi=BEATS.length-1;
  const b=BEATS[bi], bt=T-b.start, st=T-b.sStart, band=BAND[b.sc];

  let svg=`<defs>${tintDefs()}<clipPath id="sc"><rect width="1080" height="1100"/></clipPath>
    <linearGradient id="fadeB" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${band}" stop-opacity="0"/><stop offset="1" stop-color="${band}"/></linearGradient>
    <radialGradient id="glowY"><stop offset="0" stop-color="#ffd76a" stop-opacity=".45"/><stop offset="1" stop-color="#ffd76a" stop-opacity="0"/></radialGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff6c8" stop-opacity=".55"/><stop offset="1" stop-color="#fff6c8" stop-opacity="0"/></linearGradient>
    <radialGradient id="vig" cx=".5" cy=".45" r=".75"><stop offset=".62" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".3"/></radialGradient></defs>`;
  svg+=`<g clip-path="url(#sc)">${S[b.sc](st,b.sDur,b.B)}<rect width="1080" height="1100" fill="url(#vig)"/></g>`;
  svg+=`<rect y="900" width="1080" height="202" fill="url(#fadeB)"/>`;
  if(b.start===b.sStart&&bi>0) svg+=`<rect width="1080" height="1920" fill="#0b0c16" opacity="${(1-prog(bt,0,.1)).toFixed(3)}"/>`;
  scEl.innerHTML=svg;
  let htxt=b.hud;
  if(htxt==='#kitchen') htxt='COCINA · '+(1+Math.min(2,Math.floor(bt/(b.d/3))))+'/3';
  hudEl.innerHTML=hudSvg(htxt,!!b.alert,(bi>0&&BEATS[bi-1].hud===b.hud)||b.hud==='#kitchen'?1:prog(bt,0,.28),T);
  const words=b.cap.split(' ').map(w=>{const [tx,c]=w.split('|');return{tx,c}});
  let len=b.cap.replace(/\|[a-z]/g,'').length, from=0, to=words.length;
  if(len>34&&words.length>5){ // long line: show it in two pages, like the original captions
    let best=1,bs=1e9,acc=0;
    for(let i=1;i<words.length;i++){acc+=words[i-1].tx.length+1;const sc=Math.abs(acc/len-.5)-(/[.,:…]$/.test(words[i-1].tx)?.22:0);if(sc<bs){bs=sc;best=i}}
    if(bt<b.wt[best]-.04) to=best; else from=best;
    len=words.slice(from,to).reduce((a,w)=>a+w.tx.length+1,0);
  }
  capEl.style.fontSize=(len>30?92:len>22?100:108)+'px';
  let html='';
  words.forEach((w,i)=>{ if(i<from||i>=to) return;
    const wt=b.wt[i], on=bt>=wt, k=prog(bt,wt,wt+.14);
    const col=on?(w.c?ACC[w.c]:'#ffffff'):'rgba(255,255,255,.28)';
    const sc=on?lerp(1.16,1,eOut(k)):1;
    const glow=on&&w.c?`;text-shadow:0 0 28px ${ACC[w.c]}88,0 6px 0 rgba(0,0,0,.28)`:'';
    html+=`<span class="w" style="color:${col};transform:scale(${sc.toFixed(3)})${glow}">${w.tx}</span> `;
  });
  capEl.innerHTML=html;
  const cp=eOut(prog(bt,0,.12));
  capEl.style.transform=`translateY(${(1-cp)*20}px)`;
  capEl.style.opacity=cp.toFixed(3);
};
window.render(0);
