<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:#000}#st{position:relative;width:1080px;height:1920px;overflow:hidden}canvas,svg{position:absolute;left:0;top:0}</style></head>
<body><div id="st"><canvas id="gl" width="1080" height="1920"></canvas><svg id="sv" width="1080" height="1920" viewBox="0 0 1080 1920"></svg></div>
<script src="three_post.js"></script><script src="world2.js"></script><script src="stick.js"></script>
<script>
const V = (x, y, z) => new THREE.Vector3(x, y, z);
const DANI = { outfit: 'tee', top: '#f27b2b', topD: '#b8501a', strap: '#2f3a52', number: '7', socks: null, hair: 'quiff', hairCol: '#2a1a12', shoes: '#f4f2ec', sole: '#e94b3c', wrist: '#ffd34a' };
const IKER = { outfit: 'hood', top: '#34a061', topD: '#20703f', hair: null, patch: '#ffd34a', cap: '#1f3c88', capD: '#16295e', capLogo: '#ffd34a', shoes: '#2a2c34', sole: '#f4f2ec', belly: 1.12 };
window.shot = function (n) { const W = W2; W.floaters(0); W.setNet(0, 0); W.BALL.position.set(.9, .12, -9.6); let s = '';
  if (n === 1) { W.setCam(V(.6, 1.15, -5.2), V(.5, 1.05, -10.3), 46, 5.1, .002); W.render();
    s += stickAt(Object.assign({}, IKER, { face: 'open', mouth: 'smile', armL: [16, 18], armR: [14, 22], look: [-4, 0], legL: [4, 0], legR: [5, 0] }), V(1.2, 0, -10.5), V(1.2, 1.66, -10.5), W);
    s += stickAt(Object.assign({}, DANI, { face: 'smug', mouth: 'smirk', armL: [18, 20], armR: [40, 60], look: [4, 0], legL: [6, 0], legR: [3, 0] }), V(-.15, 0, -10.0), V(-.15, 1.62, -10.0), W); }
  if (n === 2) { W.setCam(V(.15, 1.45, -7.0), V(-.15, 1.18, -10.0), 34, 3.0, .005); W.render();
    s += stickAt(Object.assign({}, DANI, { face: 'smug', mouth: 'smirk', armL: [18, 20], armR: [40, 60], look: [4, 0], brows: -.2, browTilt: .3 }), V(-.15, 0, -10.0), V(-.15, 1.62, -10.0), W); }
  if (n === 3) { W.setCam(V(1.55, 1.45, -7.5), V(1.2, 1.2, -10.5), 34, 3.0, .005); W.render();
    s += stickAt(Object.assign({}, IKER, { face: 'wide', mouth: 'o', armL: [40, 70], armR: [30, 80], look: [-6, -4], brows: .6, sweat: true }), V(1.2, 0, -10.5), V(1.2, 1.66, -10.5), W); }
  W.setNight(n === 4); W.charLight = n === 4 ? { tint: '#8f80ff', k: .38, rim: '#ff5ad0', rimA: .85, rimX: -1, rimY: -.3 } : { tint: '#ffe2bd', k: .14, rim: '#fff6e6', rimA: .5, rimX: -1, rimY: -.6 };
  if (n === 4) { W.setCam(V(3.4, 1.1, -7.6), V(.2, 2.0, -12.6), 50, 5.0, .002); W.floaters(0); W.setNet(0, 0); W.BALL.position.set(.9, .12, -11.0); W.render();
    s += stickAt(Object.assign({}, IKER, { face: 'wide', mouth: 'o', armL: [16, 30], armR: [120, 40], look: [-6, 0], brows: .6, sweat: true }), V(1.0, 0, -12.6), V(1.0, 1.66, -12.6), W);
    s += stickAt(Object.assign({}, DANI, { face: 'smug', mouth: 'smirk', armL: [18, 20], armR: [16, 25], look: [6, 0] }), V(-.2, 0, -11.9), V(-.2, 1.62, -11.9), W); }
  document.getElementById('sv').innerHTML = s; };
document.title = 'ready';
</script></body></html>
